<style>
:root{--bg:#161512;--fg:#e8e6e1;--muted:#9c9890;--card:#211f1c;--line:#34312c;--accent:#81b64c;--accent-fg:#10140b}
@media (prefers-color-scheme:light){:root{--bg:#f7f5f0;--fg:#1f1d1a;--muted:#625e56;--card:#fff;--line:#e0dcd2;--accent:#3d7a1d;--accent-fg:#fff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--accent)}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
header{padding:72px 0 48px;text-align:center;
 background:conic-gradient(var(--line) 25%,transparent 0 50%,var(--line) 0 75%,transparent 0) 0 0/48px 48px;
 background-blend-mode:normal}
header .wrap{background:var(--bg);padding:32px 20px;border-radius:12px;max-width:640px}
h1{font-size:clamp(2.2rem,6vw,3.4rem);line-height:1.1;margin:0 0 12px;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.lead{font-size:1.2rem;color:var(--muted);margin:0 0 28px}
.btn{display:inline-block;padding:12px 22px;border-radius:8px;font-weight:600;text-decoration:none;margin:4px}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{border:1px solid var(--line);color:var(--fg)}
section{padding:40px 0}
h2{font-size:1.6rem;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.card h3{margin:0 0 6px;font-size:1.05rem}
.card p{margin:0;color:var(--muted);font-size:.95rem}
ol li{margin-bottom:10px}
pre{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;overflow-x:auto;font-size:.9rem}
.note{border-left:3px solid var(--accent);padding:4px 16px;color:var(--muted)}
footer{border-top:1px solid var(--line);padding:28px 0 48px;color:var(--muted);font-size:.9rem;text-align:center}
</style>

    <a class="card" href="/gsd-agent-wiki/" style="text-decoration:none;color:inherit"><h3>gsd-agent-wiki</h3><p>A portable, git-based knowledge base that gives coding agents long-term memory.</p></a>
  </div>
</section>
</main>

<footer>
  <div class="wrap">
    <a href="https://github.com/wesnam">@wesnam</a>
  </div>
</footer>
</body>
